[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-window-sim"
version = "0.1.0"
description = "Toy model for comparing static and adaptive window sizes in stream processing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4", "build>=1.0"]

[project.scripts]
streamwin = "streamwin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
